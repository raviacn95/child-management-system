name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run icons
      - run: npm run lint
      - run: npm run test
      - name: Refresh this year's movie list
        continue-on-error: true
        timeout-minutes: 3
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: node scripts/fetch-fresh-movies.mjs public/movies-fresh.json
      - run: npm run build
        env:
          VITE_FLIPKART_AFFILIATE_ID: ${{ vars.VITE_FLIPKART_AFFILIATE_ID || secrets.VITE_FLIPKART_AFFILIATE_ID }}
          VITE_AMAZON_ASSOCIATE_TAG: ${{ vars.VITE_AMAZON_ASSOCIATE_TAG || secrets.VITE_AMAZON_ASSOCIATE_TAG }}
          VITE_MEESHO_AFFILIATE_ID: ${{ vars.VITE_MEESHO_AFFILIATE_ID || secrets.VITE_MEESHO_AFFILIATE_ID }}
          VITE_CUELINKS_PUB_ID: ${{ vars.VITE_CUELINKS_PUB_ID || secrets.VITE_CUELINKS_PUB_ID }}
          VITE_ADMITAD_CODE: ${{ vars.VITE_ADMITAD_CODE || secrets.VITE_ADMITAD_CODE }}
          VITE_PLUS_CHECKOUT_URL: ${{ vars.VITE_PLUS_CHECKOUT_URL || secrets.VITE_PLUS_CHECKOUT_URL }}
          VITE_PACKS_CHECKOUT_URL: ${{ vars.VITE_PACKS_CHECKOUT_URL || secrets.VITE_PACKS_CHECKOUT_URL }}
          VITE_LEADS_ENDPOINT: ${{ vars.VITE_LEADS_ENDPOINT || secrets.VITE_LEADS_ENDPOINT }}
          VITE_SALES_EMAIL: ${{ vars.VITE_SALES_EMAIL || secrets.VITE_SALES_EMAIL }}
          VITE_SALES_WHATSAPP: ${{ vars.VITE_SALES_WHATSAPP || secrets.VITE_SALES_WHATSAPP }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
        continue-on-error: true
        with:
          packages: platform-tools platforms;android-36 build-tools;35.0.0
      - name: Point Gradle at the Android SDK
        working-directory: app/android
        continue-on-error: true
        run: |
          test -n "$ANDROID_SDK_ROOT"
          printf 'sdk.dir=%s\n' "$ANDROID_SDK_ROOT" > local.properties
          cat local.properties
      - name: Sync Capacitor Android project
        working-directory: app
        continue-on-error: true
        env:
          WILLOW_LIVE_SHELL: '1'
        run: |
          npx cap sync android
          node scripts/strip-android-compressed-assets.mjs
      - name: Assemble Android APK
        working-directory: app/android
        continue-on-error: true
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
      - name: Keep previous live release for crash fallback
        continue-on-error: true
        working-directory: .
        run: |
          git fetch origin gh-pages:gh-pages
          mkdir -p /tmp/willow-prev app/dist/releases/previous
          git archive gh-pages | tar -x -C /tmp/willow-prev
          rsync -a --delete --exclude 'releases' /tmp/willow-prev/ app/dist/releases/previous/
          printf '{"fallback":"previous"}\n' > app/dist/release.json
      - name: Stamp the live release for every installed app
        working-directory: app
        env:
          WILLOW_RELEASE: ${{ github.sha }}
          WILLOW_RELEASE_RUN: ${{ github.run_number }}
        run: node scripts/write-release.mjs dist/release.json
      - name: Publish phone and Fire Stick APKs into the live site
        working-directory: .
        run: |
          mkdir -p app/dist/downloads
          BUILT=app/android/app/build/outputs/apk/debug/app-debug.apk
          CHECKED=app/public/downloads/willow.apk
          if [ -s "$BUILT" ]; then SRC="$BUILT"
          elif [ -s "$CHECKED" ]; then SRC="$CHECKED"
          else echo "No willow.apk was built or checked in"; exit 1
          fi
          cp -f "$SRC" app/dist/downloads/willow.apk
          cp -f "$SRC" app/dist/downloads/willow-movies.apk
          printf 'releases/\n*.map\n' > app/dist/.gitignore
          ls -lh app/dist/downloads
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: willow-live-${{ github.run_number }}
          name: Willow live ${{ github.run_number }}
          files: app/dist/downloads/willow.apk,app/dist/downloads/willow-movies.apk
          make_latest: true
          fail_on_unmatched_files: true
          body: |
            Android phone APK: willow.apk (install like any app).
            Fire Stick copy: willow-movies.apk (same binary).
            Live site for phone, Windows, and Fire Stick: https://raviacn95.github.io/child-management-system/
            The APK is a shell. After this build, later website deploys update installed apps without a new APK.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: app/dist
          force_orphan: false
          exclude_assets: ''
