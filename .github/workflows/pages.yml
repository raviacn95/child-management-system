name: Deploy GitHub Pages

# The site job publishes GitHub Pages as soon as the web build is ready.
# Movie refresh lives in movies-feed.yml. The Android APK is a shell and does not block the site.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  site:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Trivy config and secrets
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: misconfig,secret
          skip-dirs: app/node_modules,app/dist,app/android,repos,.git
          severity: HIGH,CRITICAL
          exit-code: '1'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - name: Test middleware security and the willow-agent function
        working-directory: .
        run: node --test middleware/*.test.mjs supabase/functions/willow-agent/*.test.mts
      - run: npm run icons
      - run: npm run lint
      - run: npm run test
      - name: Seed the movie list from the live site when it is newer
        continue-on-error: true
        working-directory: .
        run: |
          git fetch --depth 1 origin gh-pages
          git show FETCH_HEAD:movies-fresh.json > /tmp/live-movies.json
          node app/scripts/keep-newer-feed.mjs /tmp/live-movies.json app/public/movies-fresh.json
      - run: npm run build
        env:
          VITE_FLIPKART_AFFILIATE_ID: ${{ vars.VITE_FLIPKART_AFFILIATE_ID || secrets.VITE_FLIPKART_AFFILIATE_ID }}
          VITE_AMAZON_ASSOCIATE_TAG: ${{ vars.VITE_AMAZON_ASSOCIATE_TAG || secrets.VITE_AMAZON_ASSOCIATE_TAG }}
          VITE_MEESHO_AFFILIATE_ID: ${{ vars.VITE_MEESHO_AFFILIATE_ID || secrets.VITE_MEESHO_AFFILIATE_ID }}
          VITE_CUELINKS_PUB_ID: ${{ vars.VITE_CUELINKS_PUB_ID || secrets.VITE_CUELINKS_PUB_ID }}
          VITE_ADMITAD_CODE: ${{ vars.VITE_ADMITAD_CODE || secrets.VITE_ADMITAD_CODE }}
          VITE_PLUS_CHECKOUT_URL: ${{ vars.VITE_PLUS_CHECKOUT_URL || secrets.VITE_PLUS_CHECKOUT_URL }}
          VITE_PLUS_YEARLY_CHECKOUT_URL: ${{ vars.VITE_PLUS_YEARLY_CHECKOUT_URL || secrets.VITE_PLUS_YEARLY_CHECKOUT_URL }}
          VITE_PACKS_CHECKOUT_URL: ${{ vars.VITE_PACKS_CHECKOUT_URL || secrets.VITE_PACKS_CHECKOUT_URL }}
          VITE_LEADS_ENDPOINT: ${{ vars.VITE_LEADS_ENDPOINT || secrets.VITE_LEADS_ENDPOINT }}
          VITE_SALES_EMAIL: ${{ vars.VITE_SALES_EMAIL || secrets.VITE_SALES_EMAIL }}
          VITE_SALES_WHATSAPP: ${{ vars.VITE_SALES_WHATSAPP || secrets.VITE_SALES_WHATSAPP }}
          VITE_AGENT_URL: ${{ vars.VITE_AGENT_URL }}
      - name: Keep the live APK and the previous release
        continue-on-error: true
        working-directory: .
        run: |
          git fetch --depth 1 origin gh-pages
          mkdir -p /tmp/willow-prev app/dist/releases/previous app/dist/downloads
          git archive FETCH_HEAD | tar -x -C /tmp/willow-prev
          rsync -a --delete --exclude 'releases' /tmp/willow-prev/ app/dist/releases/previous/
          if [ -s /tmp/willow-prev/downloads/willow.apk ]; then
            cp -f /tmp/willow-prev/downloads/willow.apk app/dist/downloads/willow.apk
            cp -f /tmp/willow-prev/downloads/willow.apk app/dist/downloads/willow-movies.apk
          fi
          printf 'releases/\n*.map\n' > app/dist/.gitignore
      - name: Stamp the live release for every installed app
        working-directory: app
        env:
          WILLOW_RELEASE: ${{ github.sha }}
          WILLOW_RELEASE_RUN: ${{ github.run_number }}
          WILLOW_RELEASE_NAME: Willow live ${{ github.run_number }} - web, Android, and PWA update
          WILLOW_RELEASE_CHANGES: ${{ vars.WILLOW_RELEASE_CHANGES || 'Latest Willow UI, playback, reliability, and performance improvements.' }}
        run: node scripts/write-release.mjs dist/release.json
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: app/dist
          force_orphan: false
          exclude_assets: ''

  android:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
        working-directory: app
      - run: npm run build
        working-directory: app
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;35.0.0
      - name: Point Gradle at the Android SDK
        working-directory: app/android
        run: |
          test -n "$ANDROID_SDK_ROOT"
          printf 'sdk.dir=%s\n' "$ANDROID_SDK_ROOT" > local.properties
      - name: Sync Capacitor Android project
        working-directory: app
        env:
          WILLOW_LIVE_SHELL: '1'
        run: |
          npx cap sync android
          node scripts/strip-android-compressed-assets.mjs
      - name: Assemble Android APK
        working-directory: app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Publish phone and Fire Stick APKs
        working-directory: .
        run: |
          mkdir -p app/dist/downloads
          cp -f app/android/app/build/outputs/apk/debug/app-debug.apk app/dist/downloads/willow.apk
          cp -f app/dist/downloads/willow.apk app/dist/downloads/willow-movies.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: willow-live-${{ github.run_number }}
          name: Willow live ${{ github.run_number }}
          files: app/dist/downloads/willow.apk,app/dist/downloads/willow-movies.apk
          make_latest: true
          fail_on_unmatched_files: true
          body: |
            Android phone APK: willow.apk (install like any app).
            Fire Stick copy: willow-movies.apk (same binary).
            Live site for phone, Windows, and Fire Stick: https://raviacn95.github.io/child-management-system/
            The APK is a shell. The site job publishes the web app without waiting for this build.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
