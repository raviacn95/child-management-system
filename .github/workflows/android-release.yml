name: Android release bundle

on:
  workflow_dispatch:
    inputs:
      version_code:
        description: 'Monotonically increasing Play version code'
        required: true
        type: string
      version_name:
        description: 'Human-readable version, for example 1.3.0'
        required: true
        type: string

permissions:
  contents: write

jobs:
  bundle:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: tools platform-tools platforms;android-36 build-tools;35.0.0
      - run: npm ci
      - run: npm run icons
      - run: npm run android:preflight
      - name: Decode upload keystore
        working-directory: app/android
        env:
          WILLOW_KEYSTORE_BASE64: ${{ secrets.WILLOW_KEYSTORE_BASE64 }}
        run: echo "$WILLOW_KEYSTORE_BASE64" | base64 --decode > willow-upload.keystore
      - name: Build signed release AAB
        env:
          WILLOW_VERSION_CODE: ${{ inputs.version_code }}
          WILLOW_VERSION_NAME: ${{ inputs.version_name }}
          WILLOW_KEYSTORE_FILE: ${{ github.workspace }}/app/android/willow-upload.keystore
          WILLOW_KEYSTORE_PASSWORD: ${{ secrets.WILLOW_KEYSTORE_PASSWORD }}
          WILLOW_KEY_ALIAS: ${{ secrets.WILLOW_KEY_ALIAS }}
          WILLOW_KEY_PASSWORD: ${{ secrets.WILLOW_KEY_PASSWORD }}
        run: npm run android:bundle
      - uses: actions/upload-artifact@v4
        with:
          name: willow-${{ inputs.version_name }}-release
          path: app/dist/releases/willow-release.aab
          if-no-files-found: error