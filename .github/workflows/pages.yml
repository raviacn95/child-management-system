name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run icons
      - run: npm run lint
      - run: npm run test
      - run: npm run build
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: Assemble Fire Stick APK
        continue-on-error: true
        working-directory: app
        env:
          WILLOW_LIVE_SHELL: '1'
        run: |
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          mkdir -p ../dist/downloads
          cp app/build/outputs/apk/debug/app-debug.apk ../dist/downloads/willow-movies.apk
      - name: Keep previous live release for crash fallback
        continue-on-error: true
        working-directory: .
        run: |
          git fetch origin gh-pages:gh-pages
          mkdir -p /tmp/willow-prev app/dist/releases/previous
          git archive gh-pages | tar -x -C /tmp/willow-prev
          rsync -a --delete --exclude 'releases' /tmp/willow-prev/ app/dist/releases/previous/
          printf '{"fallback":"previous"}\n' > app/dist/release.json
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: app/dist
          force_orphan: false
