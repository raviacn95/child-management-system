name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run icons
      - run: npm run lint
      - run: npm run test
      - run: npm run build
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: Assemble Fire Stick APK
        continue-on-error: true
        working-directory: app
        env:
          WILLOW_LIVE_SHELL: '1'
        run: |
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Keep previous live release for crash fallback
        continue-on-error: true
        working-directory: .
        run: |
          git fetch origin gh-pages:gh-pages
          mkdir -p /tmp/willow-prev app/dist/releases/previous
          git archive gh-pages | tar -x -C /tmp/willow-prev
          rsync -a --delete --exclude 'releases' /tmp/willow-prev/ app/dist/releases/previous/
          printf '{"fallback":"previous"}\n' > app/dist/release.json
      - name: Publish Fire Stick APK into the live site
        continue-on-error: true
        working-directory: .
        run: |
          mkdir -p app/dist/downloads
          APK=$(find app/android -name 'app-debug.apk' | head -n 1)
          if [ -z "$APK" ]; then
            echo "No APK produced"
            find app/android -name '*.apk' || true
            exit 0
          fi
          cp -f "$APK" app/dist/downloads/willow-movies.apk
          printf '*\n!downloads/\n!downloads/**\n' > app/dist/.gitignore
          ls -lh app/dist/downloads
      - uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: willow-live-${{ github.run_number }}
          name: Willow live ${{ github.run_number }}
          files: app/dist/downloads/willow-movies.apk
          make_latest: true
          body: |
            Fire Stick / Android APK (loads the live GitHub Pages app).
            Windows live app: https://raviacn95.github.io/child-management-system/?v=ott3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: app/dist
          force_orphan: false
